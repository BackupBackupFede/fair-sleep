modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/BackupBackupFede/${mod_repo}/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "icon.png"
authors = "${mod_author}"
credits = "Support: https://ko-fi.com/acesoverdeuces777"
displayURL = "https://github.com/BackupBackupFede/${mod_repo}"
description = '''
Monsters nearby no longer stop you from sleeping: click the bed at night and you sleep, whatever is lurking behind your wall. Two switches in a settings chest (/fairsleep settings): whether monsters may attack a sleeping player, and whether beds work by day (sleeping by day brings the night). Server-side only: no client install, no dependency.

Support: https://ko-fi.com/acesoverdeuces777
'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_dep}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${neo_mc_dep}"
ordering = "NONE"
side = "BOTH"
